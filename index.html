<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Intelligence Copilot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <audio id="sirenAudio" src="https://actions.google.com/sounds/v1/alarms/warning_siren.ogg" preload="auto"></audio>

    <div class="app-container">
        <button id="sosBtn" class="sos-button" aria-label="Trigger Emergency SOS">SOS</button>

        <header class="header glass-panel">
            <div class="header-content">
                <h1 class="app-title" data-i18n="appTitle">⚠️ Intelligence Platform</h1>
                <div class="header-controls">
                    <select id="langSelect" class="lang-selector">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी</option>
                        <option value="bn">বাংলা</option>
                    </select>
                    <div class="status-indicator">
                        <span id="networkStatus" class="status-dot animate-pulse"></span>
                        <span id="networkText" data-i18n="online">Online</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="top-dashboard grid-2">
                <div class="glass-card location-card">
                    <h3 data-i18n="location">Detected Zone</h3>
                    <h2 id="geoCity">Acquiring Satellites...</h2>
                    <p id="geoRegion" class="text-muted">--</p>
                </div>
                <div class="glass-card readiness-card text-center">
                    <h3 data-i18n="safetyScore">Safety Score</h3>
                    <div class="circular-score" id="safetyScoreRing">
                        <span id="safetyScoreTxt">--</span>
                    </div>
                </div>
            </section>

            <section class="glass-card map-section">
                <h3 data-i18n="liveMap">🗺️ Live Threat Map</h3>
                <div id="disasterMap" class="map-container"></div>
            </section>

            <section class="glass-card emergency-section" id="emergencyPanel">
                <h3 data-i18n="emergency">Local Emergency Routing</h3>
                <div class="resources-grid" id="emergencyGrid">
                    </div>
            </section>

            <div class="content-grid">
                <aside class="alerts-panel glass-card">
                    <h2 data-i18n="activeThreats">📋 Active Threats</h2>
                    <div id="alertsContainer" class="alerts-container"></div>
                </aside>

                <div class="analysis-column glass-card">
                    <h2 data-i18n="copilotAnalysis">🤖 Copilot Analysis</h2>
                    <div id="reasoningContent">Awaiting data stream...</div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
