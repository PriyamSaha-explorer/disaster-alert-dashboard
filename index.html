<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Alert Dashboard - Microsoft Hackathon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="app-title"><span class="title-icon">⚠️</span> Alert Dashboard</h1>
                </div>
                <div class="header-right">
                    <div class="status-indicator">
                        <span class="status-dot animate-pulse"></span>
                        <span class="status-text">Live</span>
                    </div>
                    <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="weather-section">
                <div class="weather-card" id="weatherCard">
                    <div class="weather-loading">
                        <div class="spinner"></div>
                        <p>Syncing telemetry...</p>
                    </div>
                </div>
            </section>

            <section class="summary-section">
                <div class="summary-cards">
                    <div class="summary-card critical">
                        <div class="card-number" id="criticalCount">0</div>
                        <div class="card-label">Critical</div>
                    </div>
                    <div class="summary-card high">
                        <div class="card-number" id="highCount">0</div>
                        <div class="card-label">High</div>
                    </div>
                    <div class="summary-card medium">
                        <div class="card-number" id="mediumCount">0</div>
                        <div class="card-label">Medium</div>
                    </div>
                    <div class="summary-card low">
                        <div class="card-number" id="lowCount">0</div>
                        <div class="card-label">Low</div>
                    </div>
                </div>
            </section>

            <div class="content-grid">
                <aside class="alerts-panel">
                    <div class="panel-header">
                        <h2>📋 Threat Log</h2>
                        <span class="alert-count" id="alertCountBadge">0</span>
                    </div>
                    <div class="alerts-container" id="alertsContainer">
                        <div class="loading-spinner">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </aside>

                <div class="analysis-column">
                    <section class="ai-reasoning-panel">
                        <div class="panel-header">
                            <h2>🤖 Copilot Agent</h2>
                            <span class="ai-badge">Active</span>
                        </div>
                        
                        <div class="risk-meter-container hidden" id="riskMeterContainer">
                            <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">THREAT LEVEL:</span>
                            <div class="risk-meter-bg">
                                <div class="risk-meter-fill" id="riskMeterFill"></div>
                            </div>
                        </div>

                        <div class="reasoning-content" id="reasoningContent">
                            <p style="color: var(--text-muted); font-size: 14px;">Awaiting telemetry data...</p>
                        </div>
                    </section>

                    <section class="actions-panel">
                        <div class="panel-header">
                            <h2>✅ Recommended Actions</h2>
                        </div>
                        <div class="actions-content" id="actionsContent">
                            <p style="color: var(--text-muted); font-size: 14px;">Actions will generate after analysis.</p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
